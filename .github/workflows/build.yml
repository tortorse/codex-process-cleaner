name: Build macOS app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        run: ./scripts/build-release.sh
      - name: Upload app archive
        uses: actions/upload-artifact@v4
        with:
          name: CodexProcessCleaner-macOS-universal
          path: dist/CodexProcessCleaner-macOS-universal.zip
          if-no-files-found: error
